timezone: Asia/Taipei
lookback_days: 3
max_per_source: 150

discovery_terms:
  - sleep
  - NREM
  - REM sleep
  - sleep deprivation
  - sleep homeostasis
  - circadian
  - EEG
  - electroencephalography
  - environmental enrichment
  - neuroscience

pubmed:
  email: ""
  tool: paperdaily

arxiv:
  categories:
    - q-bio.NC
    - q-bio.N
    - cs.LG
    - stat.ML

prefilter:
  enabled: true
  max_candidates: 40
  min_score: 8

ai:
  enabled: true
  provider: deepseek
  model: deepseek-v4-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  rank_batch_size: 20
  summary_batch_size: 5

  # First rank all rule-filtered candidates with a ranking-only prompt, then
  # summarize a broader 25-30 paper digest using full abstracts.
  digest_min: 25
  digest_max: 30
  digest_score_threshold: 45

  # DeepSeek V4 Flash CNY prices per 1M tokens.
  pricing_cny_per_million:
    input_cache_hit: 0.02
    input_cache_miss: 1.0
    output: 2.0

  interest_profile: |
    Primary focus: basic and computational questions in sleep neuroscience using animal EEG/EMG and longitudinal recordings.

    Highest-priority topics include sleep homeostasis; persistent NREM sleep-duration recovery after sleep deprivation, especially recovery during the dark phase; predictors of rebound from baseline physiology; relationships and dissociations between EEG delta/slow-wave activity and NREM duration; environmental enrichment and experience-dependent changes in sleep regulation; circadian-homeostatic interactions; wake theta, NREM sigma and related spectral dynamics; sleep fragmentation and recovery trajectories; quantitative models of sleep regulation; and methods for animal EEG signal processing and fast, generalizable sleep staging.

    Give high scores to papers that directly address these questions, provide a method/dataset that could transfer to them, or challenge a basic assumption about sleep regulation. Animal neuroscience and mechanistic/computational work are generally more relevant than broad human clinical or epidemiological sleep studies unless the latter provide a particularly useful concept or method.

site:
  title: PaperDaily
  subtitle: Daily research radar
