timezone: Asia/Taipei
lookback_days: 3
max_per_source: 150

discovery_terms:
  - sleep
  - NREM
  - REM sleep
  - sleep deprivation
  - sleep homeostasis
  - circadian
  - EEG
  - electroencephalography
  - environmental enrichment
  - neuroscience

pubmed:
  email: ""
  tool: paperdaily

arxiv:
  categories:
    - q-bio.NC
    - q-bio.N
    - cs.LG
    - stat.ML

# The deterministic prefilter is deliberately configurable so forks can adapt
# PaperDaily to another field without editing Python source code.
prefilter:
  enabled: true
  max_candidates: 40
  min_score: 8
  title_multiplier: 3
  missing_anchor_penalty: 18

  anchors:
    - sleep
    - NREM
    - REM sleep
    - non-rapid eye movement
    - slow wave activity
    - slow-wave activity
    - sleep state
    - vigilance state

  weights:
    sleep homeostasis: 14
    sleep deprivation: 14
    nrem: 14
    non-rapid eye movement: 14
    sleep rebound: 13
    recovery sleep: 13
    sleep pressure: 12
    process s: 12
    slow wave activity: 12
    slow-wave activity: 12
    rem sleep: 10
    delta power: 10
    slow wave: 9
    slow-wave: 9
    sleep staging: 10
    sleep scoring: 10
    sleep state: 9
    vigilance state: 9
    circadian: 8
    electroencephalography: 8
    eeg: 7
    theta: 6
    sigma: 6
    spindle: 6
    fragmentation: 6
    environmental enrichment: 9
    mouse: 4
    mice: 4
    rat: 4
    rodent: 4
    animal: 2
    computational: 3
    modeling: 3
    modelling: 3

  boosts:
    - any_terms: [EEG, electroencephalography, electroencephalogram]
      bonus: 6
      require_anchor: true
    - any_terms: [mouse, mice, rat, rodent]
      bonus: 4
      require_anchor: true

ai:
  enabled: true
  provider: deepseek
  model: deepseek-v4-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  rank_batch_size: 20
  summary_batch_size: 5

  # All 40 prefiltered papers are ranked and summarized. The public page shows
  # the highest-ranked 25 first and keeps ranks 26-40 in a collapsed section.
  digest_min: 40
  digest_max: 40
  digest_score_threshold: 0

  # DeepSeek V4 Flash prices in CNY per 1M tokens.
  pricing_cny_per_million:
    input_cache_hit: 0.02
    input_cache_miss: 1.0
    output: 2.0

  interest_profile: |
    Primary focus: basic and computational questions in sleep neuroscience using animal EEG/EMG and longitudinal recordings.

    Highest-priority topics include sleep homeostasis; persistent NREM sleep-duration recovery after sleep deprivation, especially recovery during the dark phase; predictors of rebound from baseline physiology; relationships and dissociations between EEG delta/slow-wave activity and NREM duration; environmental enrichment and experience-dependent changes in sleep regulation; circadian-homeostatic interactions; wake theta, NREM sigma and related spectral dynamics; sleep fragmentation and recovery trajectories; quantitative models of sleep regulation; and methods for animal EEG signal processing and fast, generalizable sleep staging.

    Give high scores to papers that directly address these questions, provide a method or dataset that could transfer to them, or challenge a basic assumption about sleep regulation. Animal neuroscience and mechanistic or computational work are generally more relevant than broad human clinical or epidemiological sleep studies unless the latter provide a particularly useful concept or method.

    Use English for all generated topic labels, relevance reasons, and scientific descriptions.

site:
  title: PaperDaily
  subtitle: Daily research radar
  featured_count: 25
