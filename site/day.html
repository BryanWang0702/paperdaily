<!doctype html>
<html lang="en" data-theme="khaki">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PaperDaily · Daily Papers</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="layout.css" />
</head>
<body>
  <main class="shell">
    <div class="page-topbar">
      <a class="back-link" id="backLink" href="./">← All days</a>
      <div class="topbar-controls">
        <div id="topicControl" class="topic-control" aria-label="Research topic selector"></div>
        <div id="themeControl" class="theme-control" aria-label="Theme selector"></div>
      </div>
    </div>
    <header class="day-header">
      <p class="eyebrow" id="topicLabel">DAILY PAPERS</p>
      <h1 id="dayTitle">Loading…</h1>
      <div class="meta day-meta" id="meta"></div>
      <section id="sourceSummary"></section>
    </header>

    <section class="filter-panel" aria-label="Paper filters">
      <div class="quick-filter-block">
        <span class="filter-label">Quick filters</span>
        <div id="keywordFilters" class="filters"></div>
      </div>
      <input id="search" type="search" placeholder="Search title, journal, author, keyword, summary, or source…" />
    </section>

    <section id="status"></section>
    <section id="papers" class="papers"></section>
  </main>
  <script src="theme.js"></script>
  <script src="topics.js"></script>
  <script src="day.js"></script>
</body>
</html>
