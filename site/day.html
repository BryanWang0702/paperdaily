<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>PaperDaily · Daily Digest</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <a class="back-link" href="./">← All days</a>
    <header class="day-header">
      <div>
        <p class="eyebrow">DAILY RESEARCH DIGEST</p>
        <h1 id="dayTitle">Loading…</h1>
        <p class="lede">PubMed · bioRxiv · medRxiv · arXiv</p>
      </div>
      <div class="meta" id="meta"></div>
    </header>

    <section class="toolbar">
      <div id="sourceFilters" class="filters"></div>
      <input id="search" type="search" placeholder="Filter title, abstract, author…" />
    </section>

    <section id="status"></section>
    <section id="papers" class="papers"></section>
  </main>
  <script src="day.js"></script>
</body>
</html>
