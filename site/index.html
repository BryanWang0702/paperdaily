<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>PaperDaily</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">PERSONAL RESEARCH RADAR</p>
        <h1>PaperDaily</h1>
        <p class="lede">New literature from PubMed, bioRxiv, medRxiv, and arXiv.</p>
      </div>
      <div class="meta" id="meta">Loading…</div>
    </header>

    <section class="toolbar">
      <div id="sourceFilters" class="filters"></div>
      <input id="search" type="search" placeholder="Filter title, abstract, author…" />
    </section>

    <section id="status"></section>
    <section id="papers" class="papers"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
