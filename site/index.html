<!doctype html>
<html lang="en" data-theme="khaki">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PaperDaily</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="layout.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">PERSONAL RESEARCH RADAR</p>
        <h1>PaperDaily</h1>
        <p class="lede">A new research digest every day. Open a date to read that day's papers.</p>
      </div>
      <div class="header-tools">
        <div id="themeControl" class="theme-control" aria-label="Theme selector"></div>
        <div class="meta" id="meta">Loading archive…</div>
      </div>
    </header>

    <section id="localStatus"></section>

    <div class="home-layout">
      <section class="archive-column">
        <div class="section-head">
          <div>
            <p class="eyebrow">DAILY ARCHIVE</p>
            <h2 class="section-title">Research days</h2>
          </div>
        </div>
        <section id="status"></section>
        <section id="archive" class="archive-grid"></section>
      </section>

      <aside class="rankings-sidebar" aria-label="Monthly top papers">
        <section class="ranking-panel">
          <div class="ranking-head">
            <div>
              <p class="eyebrow">MONTHLY TOP 5</p>
              <h2 class="ranking-title">Past 30 days</h2>
            </div>
          </div>
          <ol id="monthlyRanking" class="ranking-list"></ol>
        </section>
      </aside>
    </div>
  </main>
  <script src="theme.js"></script>
  <script src="app.js"></script>
</body>
</html>
