<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>PaperDaily</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">PERSONAL RESEARCH RADAR</p>
        <h1>PaperDaily</h1>
        <p class="lede">A new research digest every day. Open a date to read that day's papers.</p>
      </div>
      <div class="meta" id="meta">Loading archive…</div>
    </header>

    <section class="section-head">
      <div>
        <p class="eyebrow">DAILY ARCHIVE</p>
        <h2 class="section-title">Research days</h2>
      </div>
    </section>
    <section id="status"></section>
    <section id="archive" class="archive-grid"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
