ai:
  interest_profile: |
    Primary focus: practical and computational methods for EEG and related neural time-series analysis, especially methods that can transfer to animal sleep experiments.

    Highest-priority topics include fast and generalizable sleep staging or vigilance-state classification; CPU-friendly and lightweight algorithms; signal normalization across recording systems and animals; user calibration from small amounts of labeled data; spectral and time-frequency analysis; artifact removal; state-space, manifold, dynamical-system, and longitudinal modeling; interpretable feature extraction; open-source analysis software; and methods that can be integrated into an easy-to-use research GUI.

    Give high scores to methods that are computationally efficient, reproducible, adaptable across datasets, or directly useful for EEG/EMG/ACC analysis. Animal and sleep applications are especially relevant, but strong general neural-signal methods should also score highly when they are transferable. Very large GPU-dependent deep-learning systems should score lower unless they introduce a broadly useful methodological idea.

    Use English for all generated topic labels, relevance reasons, and scientific descriptions.
