ai:
  interest_profile: |
    Primary focus: basic and computational questions in sleep neuroscience using animal EEG/EMG and longitudinal recordings.

    Highest-priority topics include sleep homeostasis; persistent NREM sleep-duration recovery after sleep deprivation, especially recovery during the dark phase; predictors of rebound from baseline physiology; relationships and dissociations between EEG delta/slow-wave activity and NREM duration; environmental enrichment and experience-dependent changes in sleep regulation; circadian-homeostatic interactions; wake theta, NREM sigma and related spectral dynamics; sleep fragmentation and recovery trajectories; and quantitative models of sleep regulation.

    Give high scores to papers that directly address these questions, provide a method or dataset that could transfer to them, or challenge a basic assumption about sleep regulation. Animal neuroscience and mechanistic or computational work are generally more relevant than broad human clinical or epidemiological sleep studies unless the latter provide a particularly useful concept or method.

    Use English for all generated topic labels, relevance reasons, and scientific descriptions.
