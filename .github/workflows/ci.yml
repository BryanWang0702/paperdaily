name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src tests local_app.py tools
      - name: Validate frontend JavaScript
        run: |
          node --check site/app.js
          node --check site/day.js
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build local bundle
        run: python tools/build_local_bundle.py

  local-windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate Beijing timezone
        run: python -c "from zoneinfo import ZoneInfo; print(ZoneInfo('Asia/Shanghai'))"
      - name: Compile local launcher
        run: python -m py_compile local_app.py
      - name: Build local bundle
        run: python tools/build_local_bundle.py
