name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src tests local_app.py standalone_entry.py tools
      - name: Validate frontend JavaScript
        run: |
          node --check site/theme.js
          node --check site/app.js
          node --check site/day.js
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build local bundle
        run: python tools/build_local_bundle.py

  local-windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - name: Validate Beijing timezone
        run: python -c "from zoneinfo import ZoneInfo; print(ZoneInfo('Asia/Shanghai'))"
      - name: Compile local launcher
        run: python -m py_compile local_app.py standalone_entry.py
      - name: Build local bundle
        run: python tools/build_local_bundle.py
      - name: Build and smoke-test frozen Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build_site | Out-Null
          Copy-Item site\index.html build_site\index.html
          Copy-Item site\day.html build_site\day.html
          Copy-Item site\app.js build_site\app.js
          Copy-Item site\day.js build_site\day.js
          Copy-Item site\style.css build_site\style.css
          Copy-Item site\theme.js build_site\theme.js
          pyinstaller --noconfirm --clean --onefile --name PaperDaily `
            --collect-all tzdata `
            --add-data "build_site;site" `
            --add-data "VERSION;." `
            standalone_entry.py
          if (-not (Test-Path dist\PaperDaily.exe)) { throw "PaperDaily.exe was not created" }
          $versionOutput = & dist\PaperDaily.exe --version
          Write-Host $versionOutput
          if ($versionOutput -notmatch "PaperDaily 0.5.0") { throw "Frozen executable version smoke test failed" }
