name: Deploy GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Daily literature refresh']
    types: [completed]
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'src/**'
      - 'config.yaml'
      - 'config.template.yaml'
      - 'requirements.txt'
      - 'local_app.py'
      - 'api_token.example.txt'
      - 'START_PAPERDAILY_WINDOWS.bat'
      - 'START_PAPERDAILY_MAC_LINUX.sh'
      - 'tools/build_local_bundle.py'
      - 'docs/LOCAL_VERSION.md'
      - 'docs/LOCAL_VERSION.zh-CN.md'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build local-edition download
        run: python tools/build_local_bundle.py --output site/downloads/PaperDaily-local.zip
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
