name: Daily literature refresh

on:
  workflow_dispatch:
  schedule:
    # 08:15 and 20:15 Asia/Taipei (UTC+8)
    - cron: '15 0,12 * * *'

permissions:
  contents: write

concurrency:
  group: paperdaily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch literature
        run: python -m src.pipeline --days 3
      - name: Commit changed data
        run: |
          git config user.name "paperdaily-bot"
          git config user.email "paperdaily-bot@users.noreply.github.com"
          git add data site/data/latest.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update daily literature"
            git push
          fi
