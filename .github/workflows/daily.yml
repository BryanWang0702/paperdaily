name: Daily literature refresh

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'config.yaml'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'
  schedule:
    # 07:15 and 20:15 Asia/Taipei / Beijing time (UTC+8).
    # Two runs improve freshness; DeepSeek pricing is not time-of-day dependent.
    - cron: '15 23,12 * * *'

permissions:
  contents: write

concurrency:
  group: paperdaily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Credential preflight
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          PUBMED_EMAIL: ${{ secrets.PUBMED_EMAIL }}
        run: |
          python - <<'PY'
          import os
          required = ['DEEPSEEK_API_KEY']
          optional = ['NCBI_API_KEY', 'PUBMED_EMAIL', 'OPENAI_API_KEY']
          missing_required = []
          for name in required:
              present = bool(os.getenv(name, '').strip())
              print(f'{name}: {"SET" if present else "MISSING"}')
              if not present:
                  missing_required.append(name)
          for name in optional:
              present = bool(os.getenv(name, '').strip())
              print(f'{name}: {"SET" if present else "not set (optional)"}')
          if missing_required:
              raise SystemExit('Missing required repository secret(s): ' + ', '.join(missing_required))
          PY
      - name: Fetch and rank literature
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          PUBMED_EMAIL: ${{ secrets.PUBMED_EMAIL }}
        run: python -m src.pipeline --days 3
      - name: Commit changed data
        run: |
          git config user.name "paperdaily-bot"
          git config user.email "paperdaily-bot@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update daily literature"
            # A code/config commit can land while the refresh job is running.
            git pull --rebase origin master
            git push origin HEAD:master
          fi
