name: Daily literature refresh

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'config.yaml'
      - 'topics/**'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'
  schedule:
    # 05:30 and 20:30 Beijing time / Asia/Shanghai (UTC+8).
    - cron: '30 21,12 * * *'

permissions:
  contents: write

concurrency:
  group: paperdaily-refresh
  # A new config/topic/code push makes an older in-flight refresh stale.
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Credential preflight
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          PUBMED_EMAIL: ${{ secrets.PUBMED_EMAIL }}
        run: |
          python - <<'PY'
          import os
          from src.topics import load_topic_profiles
          from src.utils import load_config

          config = load_config()
          profiles, default_id = load_topic_profiles(config)
          ai = config.get('ai', {}) or {}
          enabled = bool(ai.get('enabled', True))
          provider = str(ai.get('provider', 'deepseek')).strip().lower()
          model = str(ai.get('model', '')).strip()
          key_env = str(ai.get('api_key_env', '')).strip()
          if not key_env:
              key_env = 'OPENAI_API_KEY' if provider == 'openai' else 'DEEPSEEK_API_KEY'

          print(f'AI provider: {provider}')
          print(f'AI model: {model or "not set"}')
          print(f'AI key environment variable: {key_env}')
          print(f'Topics: {", ".join(profile["id"] for profile in profiles)}')
          print(f'Default topic: {default_id}')

          if enabled:
              present = bool(os.getenv(key_env, '').strip())
              print(f'{key_env}: {"SET" if present else "MISSING"}')
              if not present:
                  raise SystemExit(
                      f'Missing required repository secret for the configured AI provider: {key_env}'
                  )
          else:
              print('AI ranking: disabled in config.yaml')

          for name in ['NCBI_API_KEY', 'PUBMED_EMAIL']:
              present = bool(os.getenv(name, '').strip())
              print(f'{name}: {"SET" if present else "not set (optional)"}')
          PY
      - name: Fetch and rank literature
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          PUBMED_EMAIL: ${{ secrets.PUBMED_EMAIL }}
          PAPERDAILY_RUN_KIND: ${{ github.event_name == 'schedule' && 'scheduled' || github.event_name == 'workflow_dispatch' && 'manual' || 'development' }}
        run: python -m src.runtime_pipeline --days 3
      - name: Commit changed data
        run: |
          git config user.name "paperdaily-bot"
          git config user.email "paperdaily-bot@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update daily literature"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
