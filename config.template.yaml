# Generic PaperDaily configuration template.
# Copy the relevant sections into config.yaml and replace the example domain.

timezone: UTC
lookback_days: 3
max_per_source: 150

# Optional multi-topic mode. Leave disabled for a single research interest.
# When enabled, each topics/*.yaml file inherits the shared settings below and
# can override discovery_terms, prefilter rules, AI interest_profile, and limits.
topics:
  enabled: false
  directory: topics
  default: my-first-topic
  scale_source_limit: true
  max_shared_source_results: 500

discovery_terms:
  - core topic
  - important method
  - important mechanism
  - field keyword

pubmed:
  email: ""
  tool: paperdaily

arxiv:
  categories:
    - q-bio.NC

  # Recommended for the legacy arXiv API in single-topic mode: cache an identical
  # retrieval window instead of repeating the same query during multiple refreshes.
  # Multi-topic mode revalidates the union query by default to avoid stale results
  # after a topic profile changes.
  reuse_same_window: true
  retry_delays_seconds: [10, 30]
  timeout_seconds: 45
  contact_email: ""

# Free deterministic daily shortlist.
prefilter:
  enabled: true
  max_candidates: 40
  min_score: 8
  title_multiplier: 3
  missing_anchor_penalty: 18

  anchors:
    - core topic
    - core mechanism

  weights:
    core topic: 15
    core mechanism: 12
    important method: 10
    important model: 8

  boosts:
    - any_terms: [important model, important dataset]
      bonus: 4
      require_anchor: true

ai:
  enabled: true
  provider: deepseek
  model: deepseek-v4-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY

  # Number of papers from the local shortlist that are ranked and summarized.
  # A topic profile may override this independently.
  max_analyzed: 40
  rank_batch_size: 20
  summary_batch_size: 5

  pricing_cny_per_million:
    input_cache_hit: 0.02
    input_cache_miss: 1.0
    output: 2.0

  interest_profile: |
    Primary focus: describe your scientific field and current research questions here.

    Highest-priority topics: list the questions, mechanisms, methods, datasets,
    species, populations, or experimental paradigms that are most useful to you.

    Ranking preference: explain which paper types should receive high scores and
    which broad or adjacent topics should receive lower scores.

    Use English for all generated topic labels, relevance reasons, and scientific descriptions.

site:
  title: PaperDaily
  subtitle: Daily research radar
  featured_count: 25

  # Optional Last run / Total / Estimated per year summary on the homepage.
  # Billing data are still tracked when this is false.
  show_billing: false

  # Default theme. Website visitors can switch presets directly on the page;
  # their selection is remembered in that browser.
  # Built-in themes: khaki, black, navy, forest, burgundy, custom.
  theme: khaki
  custom_theme:
    background: "#f2efe5"
    surface: "#fffdf8"
    text: "#1f2723"
    muted: "#6b7068"
    border: "#d8d3c5"
    accent: "#75684d"
    accent_text: "#ffffff"

# Optional settings for the downloadable local / standalone edition.
local:
  port: 8765

  # scheduled: refresh only if the latest scheduled slot has not already completed.
  # always: refresh every time the app opens. never: only open cached local data.
  refresh_mode: scheduled
  refresh_times:
    - "05:30"
    - "20:30"

  scheduler_enabled: true
  scheduler_check_seconds: 30

  # In scheduled mode, a saved config.yaml or topics/*.yaml change immediately
  # runs the full shared retrieval + per-topic AI pipeline.
  refresh_on_config_change: true

  # Update reminder checked before each real literature refresh.
  version_check: true
  version_manifest_url: https://raw.githubusercontent.com/BryanWang0702/paperdaily/master/standalone_version.json
